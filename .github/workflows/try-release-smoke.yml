name: Try the release smoke test

# Temporary: runs the emulator step of release-android.yml on this branch with
# an APK signed by a throwaway key. Removed before review.
on:
  push:
    branches: [nightshift/release-smoke]

permissions: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Build and sign the APK with a throwaway key
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-configuration-cache --no-daemon --console=plain
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          keytool -genkeypair -keystore "$RUNNER_TEMP/try.jks" -storepass trypass -keypass trypass \
            -alias try -keyalg RSA -keysize 2048 -validity 2 -dname CN=try
          "$build_tools/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/try.jks" --ks-pass pass:trypass \
            --out app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/aligned.apk"

      - name: Enable KVM for the emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install the server for the smoke test
        run: bun install --frozen-lockfile

      - name: Run the release APK on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_OUT: ${{ runner.temp }}/release-smoke
        with:
          api-level: '37.0'
          target: google_apis_ps16k
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: apps/android/scripts/release-smoke.sh apps/android/app/build/outputs/apk/release/app-release.apk

      - name: Keep the smoke test's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke
          path: ${{ runner.temp }}/release-smoke
          if-no-files-found: ignore
